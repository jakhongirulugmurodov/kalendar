<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahongirning kalendari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lapis:#2447A8;--lapis-deep:#16306E;--feruza:#2FB7A8;--anor:#D24A43;
    --paper:#F3F6FB;--card:#FFF;--ink:#1C2333;--muted:#6B7488;--line:#DDE4F0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--ink);
       min-height:100vh;padding:24px 14px 60px}
  .wrap{max-width:820px;margin:0 auto}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           color:var(--feruza);margin-bottom:4px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
     font-size:clamp(26px,5vw,40px);margin-bottom:6px}
  h1 .accent{color:var(--lapis)}
  .sub{font-size:14px;color:var(--muted);margin-bottom:20px}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px}
  .nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
              background:var(--card);font-size:16px;cursor:pointer;color:var(--ink);margin-left:6px}
  .nav button:hover{border-color:var(--lapis);color:var(--lapis)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .dow span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
            color:var(--muted);text-align:center;padding:4px 0}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{aspect-ratio:1/.92;border:1px solid transparent;border-radius:12px;background:none;
       cursor:pointer;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;
       color:var(--ink);display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:3px}
  .day:hover{background:var(--paper)}
  .day.empty{visibility:hidden}
  .day.today{border-color:var(--feruza)}
  .day.sel{background:var(--lapis);color:#fff}
  .day.sel .dots i{background:#fff}
  .dots{display:flex;gap:3px;height:6px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--anor)}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .legend .busy i{background:var(--anor)}
  .legend .free i{border:1.5px solid var(--muted)}
  .panel-date{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:19px;margin-bottom:4px}
  .panel-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .ev{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
      border-left:4px solid var(--anor);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .ev-time{font-weight:800;font-size:14px;color:var(--lapis);min-width:48px}
  .ev-title{flex:1;font-size:14px}
  .empty-msg{font-size:14px;color:var(--muted);padding:14px 0}
  .free-badge{display:inline-block;background:#E7F7F0;color:#1d8a5f;font-weight:700;
              font-size:13px;border-radius:999px;padding:6px 14px;margin-top:6px}
  .contact{margin-top:18px}
  .contact .card{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
  .contact p{font-size:14px;color:var(--muted)}
  .btn-contact{background:var(--lapis);color:#fff;padding:12px 22px;text-decoration:none;
               border-radius:12px;font-weight:700;font-size:14px}
  .btn-contact:hover{background:var(--lapis-deep)}
  .err{background:#FDECEA;color:var(--anor);border-radius:12px;padding:12px 16px;
       font-size:14px;font-weight:600;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Shaxsiy kalendar</div>
  <h1 id="ttl"><span class="accent">Jahongir</span>ning kalendari</h1>
  <p class="sub">Qizil nuqtali kunlar band. Bo'sh kunni tanlab, pastdagi tugma orqali bog'laning.</p>
  <div class="err" id="err"></div>

  <div class="grid2">
    <section class="card">
      <div class="cal-head">
        <div class="cal-title" id="calTitle"></div>
        <div class="nav">
          <button id="prevM" aria-label="Oldingi oy">‹</button>
          <button id="nextM" aria-label="Keyingi oy">›</button>
        </div>
      </div>
      <div class="dow"><span>Du</span><span>Se</span><span>Cho</span><span>Pa</span><span>Ju</span><span>Sha</span><span>Ya</span></div>
      <div class="days" id="daysGrid"></div>
      <div class="legend">
        <span class="busy"><i></i> Band kun</span>
        <span class="free"><i></i> Bo'sh kun</span>
      </div>
    </section>

    <section class="card">
      <div class="panel-date" id="panelDate">Kun tanlanmagan</div>
      <div class="panel-sub" id="panelSub">Kalendarda biror kunga bosing</div>
      <div id="evList"></div>
    </section>
  </div>

  <div class="contact">
    <div class="card">
      <p>Uchrashuv belgilamoqchimisiz? To'g'ridan-to'g'ri yozing:</p>
      <a class="btn-contact" id="tgLink" href="#" target="_blank" rel="noopener">✈️ Telegramda bog'lanish</a>
    </div>
  </div>
</div>

<script>
/* ======= SOZLAMALAR — shu 3 qatorni o'zingizga moslang ======= */
const OWNER_NAME = "Jahongir";
const TG_USERNAME = "sp_business_agency";
const EVENTS_URL = "events.json"; // sayt bilan bir xil repoda tursa shuni o'zgartirmang
/* ============================================================= */

const MONTHS=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
const WD=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
let events=[],view=new Date(),selected=null;
view.setDate(1);

document.getElementById('ttl').innerHTML='<span class="accent"></span>ning kalendari';
document.getElementById('ttl').querySelector('.accent').textContent=OWNER_NAME;
document.title=OWNER_NAME+"ning kalendari";
document.getElementById('tgLink').href='https://t.me/'+TG_USERNAME.replace('@','');

function pad(n){return String(n).padStart(2,'0')}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

async function load(){
  try{
    const r=await fetch(EVENTS_URL+'?t='+Date.now());
    if(!r.ok)throw new Error(r.status);
    events=await r.json();
  }catch(e){
    const er=document.getElementById('err');
    er.style.display='block';
    er.textContent="Uchrashuvlarni yuklab bo'lmadi — birozdan keyin sahifani yangilang.";
  }
  render();renderPanel();
}

function render(){
  document.getElementById('calTitle').textContent=MONTHS[view.getMonth()]+' '+view.getFullYear();
  const grid=document.getElementById('daysGrid');grid.innerHTML='';
  let off=new Date(view.getFullYear(),view.getMonth(),1).getDay()-1;if(off<0)off=6;
  const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(let i=0;i<off;i++){const b=document.createElement('button');b.className='day empty';b.tabIndex=-1;grid.appendChild(b);}
  for(let d=1;d<=dim;d++){
    const k=dkey(new Date(view.getFullYear(),view.getMonth(),d));
    const n=events.filter(e=>e.date===k).length;
    const b=document.createElement('button');
    b.className='day'+(k===dkey(new Date())?' today':'')+(k===selected?' sel':'');
    b.setAttribute('aria-label',d+' '+MONTHS[view.getMonth()]+(n?', band':', bo\u02bbsh'));
    b.innerHTML='<span>'+d+'</span>'+(n?'<span class="dots">'+'<i></i>'.repeat(Math.min(n,3))+'</span>':'');
    b.onclick=()=>{selected=k;render();renderPanel();};
    grid.appendChild(b);
  }
}

function renderPanel(){
  const pd=document.getElementById('panelDate'),ps=document.getElementById('panelSub'),
        list=document.getElementById('evList');
  if(!selected){pd.textContent='Kun tanlanmagan';ps.textContent='Kalendarda biror kunga bosing';list.innerHTML='';return;}
  const d=new Date(selected+'T00:00:00');
  pd.textContent=d.getDate()+' '+MONTHS[d.getMonth()]+', '+WD[d.getDay()].toLowerCase();
  const evs=events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  list.innerHTML='';
  if(!evs.length){
    ps.textContent='Bu kun bo\u02bbsh';
    list.innerHTML='<div class="free-badge">✓ Uchrashuv uchun qulay kun</div>';
    return;
  }
  ps.textContent=evs.length+' ta uchrashuv bor';
  evs.forEach(e=>{
    const row=document.createElement('div');row.className='ev';
    const t=document.createElement('span');t.className='ev-time';t.textContent=e.time||'—';
    const tt=document.createElement('span');tt.className='ev-title';tt.textContent=e.title;
    row.append(t,tt);list.appendChild(row);
  });
}

document.getElementById('prevM').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
document.getElementById('nextM').onclick=()=>{view.setMonth(view.getMonth()+1);render();};
load();
</script>
</body>
</html>
